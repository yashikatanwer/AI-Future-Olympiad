<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz | AIFO</title><link rel="stylesheet" href="/static/style.css"></head><body><nav><a class="brand" href="/">AIFO</a><div><a href="/learn">Learn</a><a href="/activities">Activities</a><a href="/practice">Practice</a><a href="/olympiad">Olympiad</a><a href="/about">About</a></div></nav><main><a class="back" href="{{ back }}">← Back</a><h1>{{ heading }}</h1><form method="post">{% for i,q in enumerate(questions) %}<div class="question"><b>{{i+1}}. {{q[0]}}</b>{% for j,opt in enumerate(q[1]) %}<label><input type="radio" name="q{{i}}" value="{{j}}" required> {{opt}}</label>{% endfor %}</div>{% endfor %}<button class="btn" type="submit">Submit & See Score</button></form></main><footer>AIFO · AI Future Olympiad · Proposed educational program for Grades 5–8</footer></body></html>
